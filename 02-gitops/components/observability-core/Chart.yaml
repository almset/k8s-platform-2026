apiVersion: v2
name: platform-observability-core
version: 1.0.0
dependencies:
  - name: opentelemetry-collector
    version: "0.110.0" # Стабильная актуальная версия чарта
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"

  - name: prometheus
    version: "29.21.0" # Стабильная актуальная версия от Prometheus Community
    repository: "https://prometheus-community.github.io/helm-charts"

  - name: loki
    version: "18.4.4" # Версия из нового репозитория Grafana Community
    repository: "https://grafana-community.github.io/helm-charts"

  - name: tempo
    version: "1.24.4" # Стабильная версия (в зависимости от режима, см. примечание)
    repository: "https://grafana-community.github.io/helm-charts"

  - name: pyroscope
    version: "2.2.0" # Обновленная стабильная версия для Continuous Profiling
    repository: "https://grafana-community.github.io/helm-charts"
